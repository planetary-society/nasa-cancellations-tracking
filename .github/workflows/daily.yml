name: Daily NASA termination tracking

on:
  schedule:
    # 15:00 UTC daily (7:00 AM PDT / 8:00 AM PST)
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --locked --group dev

      # Lint and tests gate the fetch: a broken vocabulary never publishes.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

      # doge + api + merge. The local mirror is never available in CI; its
      # part file (output/parts/mirror_terminations.csv) is committed by
      # local runs and merged here untouched.
      - name: Fetch and merge
        run: uv run nasatrack daily

      # file_pattern deliberately excludes parts/mirror_terminations.csv and
      # everything under data/, consolidated/, verification/ - CI must never
      # touch the mirror part or the historical tree.
      #
      # always(): the DOGE refresh writes doge_claims.csv before the API door
      # runs, so a failed API sweep must not discard a refresh that already
      # succeeded on its own. The job still reports failure from the failed
      # step, and an unchanged terminations.csv produces no diff to commit.
      - if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily update"
          file_pattern: "output/*.csv output/parts/api_terminations.csv"
          commit_user_name: GitHub Actions Bot
          commit_user_email: github-actions-bot@users.noreply.github.com
          commit_author: GitHub Actions Bot <github-actions-bot@users.noreply.github.com>
