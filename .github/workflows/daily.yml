name: Daily Search and Commit

on:
  schedule:
    # Runs at 15:00 UTC daily, which corresponds to:
    # - 7:00 AM PDT (Pacific Daylight Time, UTC-7)
    # - 8:00 AM PST (Pacific Standard Time, UTC-8)
    # Adjust the hour if you prefer 7am PST / 6am PDT (use '14' instead of '15').
    - cron: "0 15 * * *"
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  run_search:
    runs-on: ubuntu-latest
    permissions:
      # Required to checkout the code
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Use the latest major version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10" # Specify your desired Python version
          cache: "pip" # Cache dependencies for faster builds

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure you have a requirements.txt file listing pandas, requests, etc.
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found. Please create one."
            # You might need to install libraries directly if no requirements.txt exists
            # pip install pandas requests
            # Add any other libraries your search script or query classes need
          fi
        # Add error handling for missing requirements.txt if desired

      - name: Run the Search Script
        id: search
        continue-on-error: true
        run: |

          python search.py

      # Runs as its own step so the ledger is refreshed every day, not only on
      # days the sources changed: search.py returns early when today's snapshot
      # is byte-identical to yesterday's, which skips its internal rebuild. A
      # full rebuild also picks up any hand-edits to verification/*.csv made
      # since the last run.
      #
      # Deliberately NOT --update: the incremental path rebuilds description
      # history from the latest snapshot alone, so statuses that depend on
      # older text (reinstated, vacated) get lost. Re-reading the archive costs
      # ~2 seconds.
      #
      # On failure search.py has already rebuilt from accepted snapshots plus
      # any successful metadata sidecars. Never run the normal publication
      # build here: its membership must remain gated by snapshot acceptance.
      - name: Update the Master Ledger
        if: steps.search.outcome == 'success'
        run: |

          python build_master_ledger.py

      - name: Commit and Push Changes
        if: steps.search.outcome == 'success'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily update"

          file_pattern: "data/*.csv consolidated/*.csv verification/*.csv"

          commit_user_name: GitHub Actions Bot
          commit_user_email: github-actions-bot@users.noreply.github.com
          commit_author: GitHub Actions Bot <github-actions-bot@users.noreply.github.com>

      - name: Preserve successful enrichment from a rejected snapshot
        if: steps.search.outcome == 'failure'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Preserve transaction enrichment from rejected snapshot"
          file_pattern: "verification/award_transaction_facts.csv verification/award_period_change_facts.csv consolidated/master_ledger.csv"
          commit_user_name: GitHub Actions Bot
          commit_user_email: github-actions-bot@users.noreply.github.com
          commit_author: GitHub Actions Bot <github-actions-bot@users.noreply.github.com>

      - name: Surface rejected snapshot failure
        if: steps.search.outcome == 'failure'
        run: exit 1
