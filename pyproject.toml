[project]
name = "nasatrack"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "usaspending-orm",
    "psycopg[binary]",
    "requests",
    "python-dotenv",
]

[project.scripts]
nasatrack = "nasatrack.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "responses",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasatrack"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
